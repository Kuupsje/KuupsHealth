<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f6f62">
<title>Gezondheidsdagboek</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2a28;--muted:#6b7673;--accent:#2f6f62;--accent2:#e0efe9;--line:#e3e0d8;--warn:#c9822b;--bad:#b84a4a;--s0:#e8ecea;--s1:#f3dfa6;--s2:#efb27a;--s3:#d9645a;--shade1:#e9a3a3;--shade2:#f0c987}
@media (prefers-color-scheme:dark){:root{--bg:#141a19;--card:#1d2523;--ink:#e8efed;--muted:#97a5a1;--accent:#6bb8a5;--accent2:#223632;--line:#2c3733;--warn:#e0a24f;--bad:#e07a7a;--s0:#2a3532;--shade1:#8a4a4a;--shade2:#8a6a30}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
header h1{font-size:18px;margin:0}
.status{font-size:12px;color:var(--muted)}
.status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:5px}
.status.ok i{background:var(--accent)}
main{max-width:760px;margin:0 auto;padding:12px 12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;letter-spacing:.2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{margin:10px 0}
.lbl{font-size:14px;margin-bottom:5px}
.scale{display:flex;gap:6px}
.scale button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.scale button.on{border-color:var(--ink);font-weight:600;color:#1f2a28}
.scale button.on.v0{background:var(--s0)}.scale button.on.v1{background:var(--s1)}.scale button.on.v2{background:var(--s2)}.scale button.on.v3{background:var(--s3);color:#fff}
.scale.neutral button.on{background:var(--accent2);color:var(--ink)}
.scale .sub{display:block;font-size:10px;font-weight:400;opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.tag{background:var(--accent2);border-color:transparent;padding:6px 10px}
.chip.tag b{margin-left:6px;opacity:.6;font-weight:400}
.counter{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.counter:last-child{border-bottom:0}
.counter .c{display:flex;align-items:center;gap:12px}
.counter button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
.counter .v{min-width:24px;text-align:center;font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;max-width:100%}
textarea{width:100%;min-height:80px}
input.sm{width:66px}
input.time{width:100px}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline>div{flex:1;min-width:130px}
.meal{padding:8px 0;border-bottom:1px dashed var(--line)}
.meal:last-child{border-bottom:0}
.mhead{display:flex;justify-content:space-between;margin-bottom:4px}
.item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:15px}
.item .t{color:var(--muted);font-size:13px;width:44px}
.item .n{flex:1}
.item .k{color:var(--muted);font-size:13px}
.x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 6px}
form.add{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
form.add input[name=name]{flex:1 1 0;min-width:0}
form.add input[name=g],form.add input[name=kcal]{width:58px}
.sugg{margin-top:2px}
.sugg .sg{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;margin-top:4px;font:inherit;font-size:14px;cursor:pointer}
.sugg .sg b{display:block;font-weight:600}
.sugg .sg.past{background:var(--accent2)}
select.fresh{width:92px;padding:9px 4px;font-size:14px}
form.add .plus{padding:9px 12px;margin-left:auto}
form.add input[name=tag]{flex:1;min-width:0}
.plus,.btn{padding:9px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;font:inherit;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.datebar button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.datebar .mid{flex:1;text-align:center}
.datebar .mid b{display:block}.datebar .mid b::first-letter{text-transform:uppercase}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--accent2);font-size:12px;margin:2px 4px 0 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
tr.click{cursor:pointer}
.sig-duidelijk{color:var(--bad);font-weight:700}
.sig-mogelijk{color:var(--warn);font-weight:700}
.sig-geen{color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-top:6px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;background:var(--c)}
.banner{background:var(--accent2);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner.warn{background:#f6e7c8;color:#4a3510}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin:4px 0}
code,pre{background:var(--accent2);border-radius:8px;font-size:12px}
pre{padding:10px;overflow:auto;white-space:pre-wrap}
nav#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav#tabs button{flex:1;padding:12px 0 10px;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
nav#tabs button.on{color:var(--accent);font-weight:700;box-shadow:inset 0 3px 0 var(--accent)}
.err{color:var(--bad);font-size:13px;margin-top:6px}
.ok{color:var(--accent);font-size:13px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media print{
 nav#tabs,header,.noprint,.datebar button{display:none!important}
 body{background:#fff;color:#000;padding:0}
 .card{border:1px solid #bbb;break-inside:avoid}
 main{max-width:none}
}
</style>
</head>

function normDay(d,date){

/* ================= firebase ================= */
function setStatus(){
  var el=document.getElementById('status');if(!el)return;
  var ok=!!S.user;
  el.className='status'+(ok?' ok':'');
  el.innerHTML='<i></i><span>'+(ok?'Gesynchroniseerd':(lsGet(LS_FB)?'Firebase: niet ingelogd':'Alleen lokaal'))+'</span>';

function parseFbConfig(txt){
  txt=(txt||'').trim();
  try{var o=JSON.parse(txt);if(o&&o.apiKey&&o.projectId)return o;}catch(e){}
  var keys=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'],o2={};
  keys.forEach(function(k){var m=txt.match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));if(m)o2[k]=m[1];});
  return (o2.apiKey&&o2.projectId)?o2:null;
}
function initFirebase(){
  var raw=lsGet(LS_FB);if(!raw)return;
  if(typeof firebase==='undefined'){S.msg='De Firebase-bibliotheek is niet geladen (offline?). De app werkt wel lokaal.';S.msgType='err';return;}
  var cfg=parseFbConfig(raw);if(!cfg){S.msg='Firebase-configuratie niet herkend.';S.msgType='err';return;}
  try{
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    auth=firebase.auth();db=firebase.firestore();
    auth.onAuthStateChanged(function(u){
      S.user=u||null;setStatus();
      if(u)startSync();else stopSync();
      if(S.tab==='meer')render();
    });
  }catch(e){S.msg='Firebase initialiseren mislukt: '+e.message;S.msgType='err';}
}
function userRef(){return db.collection('users').doc(S.user.uid);}
function pushDay(date){
  if(!S.user||!db)return;
  clearTimeout(timers[date]);
  timers[date]=setTimeout(function(){
    var d=S.days[date];if(!d)return;
    userRef().collection('days').doc(date).set(JSON.parse(JSON.stringify(d))).catch(function(e){S.msg='Opslaan in Firebase mislukt: '+e.message;S.msgType='err';});
  },700);
}
function pushSettings(){
  if(!S.user||!db)return;
  userRef().collection('meta').doc('settings').set(JSON.parse(JSON.stringify(S.settings))).catch(function(){});
}
function startSync(){
  stopSync();firstSnap=true;remoteTimes={};
  unsubDays=userRef().collection('days').onSnapshot(function(snap){
    var changed=false;
    snap.docChanges().forEach(function(ch){
      if(ch.type==='removed')return;
      var r=ch.doc.data(),id=ch.doc.id;remoteTimes[id]=r.updatedAt||0;
      var l=S.days[id];
      if(!l||(r.updatedAt||0)>(l.updatedAt||0)){S.days[id]=normDay(r,id);changed=true;}
    });
    if(firstSnap){
      firstSnap=false;
      Object.keys(S.days).forEach(function(k){if(remoteTimes[k]==null||S.days[k].updatedAt>remoteTimes[k])pushDay(k);});
    }
    if(changed){persistDays();var a=document.activeElement;if(!a||!/INPUT|TEXTAREA|SELECT/.test(a.tagName))render();}
  },function(e){S.msg='Synchroniseren mislukt: '+e.message+' (controleer de Firestore-regels).';S.msgType='err';if(S.tab==='meer')render();});
  unsubSet=userRef().collection('meta').doc('settings').onSnapshot(function(doc){
    if(doc.exists){
      var r=doc.data();
      if((r.updatedAt||0)>(S.settings.updatedAt||0)){S.settings=Object.assign({meds:DEFAULT_MEDS.slice()},r);persistSettings();render();}
      else if((r.updatedAt||0)<(S.settings.updatedAt||0))pushSettings();
    }else pushSettings();
  },function(){});
}
function stopSync(){if(unsubDays){unsubDays();unsubDays=null;}if(unsubSet){unsubSet();unsubSet=null;}}

/* ================= cycle model ================= */
function cycleModel(){
  var starts=Object.keys(S.days).filter(function(k){return S.days[k].cyc&&S.days[k].cyc.first;}).sort();
  var diffs=[];for(var i=1;i<starts.length;i++)diffs.push(diffDays(starts[i],starts[i-1]));
  var good=diffs.filter(function(x){return x>=18&&x<=60;});
  return {starts:starts,avg:good.length?Math.round(mean(good)):28,diffs:diffs,known:good.length>0};
}
function cycleInfo(date,model){
  var prev=null,next=null;
  for(var i=0;i<model.starts.length;i++){var s=model.starts[i];if(s<=date)prev=s;else{next=s;break;}}
  if(!prev)return null;
  var day=diffDays(date,prev)+1;
  var dtn=next?diffDays(next,date):(model.avg+1-day);
  if(!next&&day>model.avg+14)return {day:day,phase:null,dtn:null};
  var d=S.days[date],mens=!!(d&&d.cyc&&d.cyc.mens);
  var ov=Math.max(10,model.avg-14),phase;
  if(mens||day<=5)phase='Menstruatie';
  else if(dtn>=1&&dtn<=5)phase='Premenstrueel';
  else if(day<ov-1)phase='Folliculair';
  else if(day<=ov+1)phase='Rond ovulatie';
  else phase='Luteaal';
  return {day:day,phase:phase,dtn:dtn};
}

/* ================= NEVO zoeken ================= */
var NEVO_REF='Gebaseerd op gegevens van NEVO-online versie 2025/9.0, RIVM, Bilthoven en andere gegevens';
var NEV=null,NEV_BY={};
function nvNorm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%+ ]+/g,' ').replace(/\s+/g,' ').trim();}
function nevIndex(){
  if(NEV)return NEV;
  NEV=(typeof NEVO_DATA!=='undefined'?NEVO_DATA:[]).map(function(r){
    var it={code:r[0],name:r[1],syn:r[2],kj:r[3],kcal:r[4],basis:r[5],n:nvNorm(r[1])};
    it.nw=it.n.split(' ');it.alts=[it.n].concat([String(r[2]).split('/')[0]].map(nvNorm).filter(Boolean));it.words=nvNorm(r[1]+' '+String(r[2]).replace(/\//g,' ')).split(' ');NEV_BY[it.code]=it;return it;});
  return NEV;
}
function dispName(it,q){
  var t0=nvNorm(q).split(' ')[0],sy=String(it.syn||'').split('/')[0].trim();
  if(sy&&t0&&nvNorm(sy).split(' ')[0].indexOf(t0)===0&&it.n.split(' ')[0].indexOf(t0)!==0)return sy;
  return it.name;
}
function nevByCode(c){nevIndex();return NEV_BY[c]||null;}
function nevSearch(q,limit){
  var toks=nvNorm(q).split(' ').filter(Boolean);if(!toks.length)return [];
  var joined=toks.join(' '),out=[];
  nevIndex().forEach(function(it){
    var sub=0;
    var ok=toks.every(function(t){
      if(it.words.some(function(w){return w.indexOf(t)===0;}))return true;
      if(t.length>=4&&it.words.some(function(w){return w.indexOf(t)>0;})){sub++;return true;}
      return false;
    });
    if(!ok)return;
    var cls=4,t0=toks[0];
    it.alts.forEach(function(al,ai){
      var fw=al.split(' ')[0],c;
      if(al===joined)c=0;
      else if(fw===t0&&al.indexOf(joined)===0)c=1;
      else if(fw===t0)c=2;
      else if(fw.length>t0.length&&fw.slice(-t0.length)===t0)c=2.2;
      else if(fw.indexOf(t0)===0)c=4;
      else c=5;
      if(ai>0&&c>0&&c<4)c+=1.5;
      if(c<cls)cls=c;
    });
    if(cls===4&&!it.alts.some(function(al){return al.split(' ')[0].indexOf(t0)===0;}))cls=5;
    out.push({it:it,cls:cls,sub:sub});
  });
  out.sort(function(a,b){return a.cls-b.cls||a.sub-b.sub||a.it.name.length-b.it.name.length;});
  return out.slice(0,limit||6).map(function(o){return o.it;});
}
/* eigen schattingen (geen NEVO): gewicht per stuk, snee, plak enzovoort */
var PORTIONS=[
  {re:/brood/,not:/broodje|pudding|beleg|kruim/,unit:'snee',g:35},
  {re:/^ei kippen/,unit:'stuk',g:55},
  {re:/^banaan$/,unit:'stuk',g:100},
  {re:/^mandarijn$/,unit:'stuk',g:50},
  {re:/^appel /,unit:'stuk',g:150},
  {re:/^peer /,unit:'stuk',g:150},
  {re:/^kaas/,not:/smeer|room|huttenkase|strooi|geraspt|blauw/,unit:'plak',g:20},
  {re:/^boter /,unit:'portie',g:5},
  {re:/^melk /,not:/koffie|choco|gecond|rauw|karne/,unit:'glas',g:150},
  {re:/^(koffie|thee) bereid$/,unit:'kopje',g:125}
];
var UNITMAP={x:'stuk',st:'stuk',stuk:'stuk',stuks:'stuk',snee:'snee',sneetje:'snee',sneetjes:'snee',boterham:'snee',boterhammen:'snee',plak:'plak',plakje:'plak',plakjes:'plak',plakken:'plak',glas:'glas',glazen:'glas',kopje:'kopje',kopjes:'kopje',portie:'portie',porties:'portie'};
function findPortion(it,unit){
  var c=PORTIONS.filter(function(p){return p.re.test(it.n)&&!(p.not&&p.not.test(it.n));});
  return c.find(function(p){return p.unit===unit;})||c[0]||null;
}
function parseQty(q){
  q=String(q||'').trim();var m,res={g:null,count:null,unit:null,rest:q};
  if((m=q.match(/^(\d+(?:[.,]\d+)?)\s*(g|gr|gram|ml)\b\.?\s*(.*)$/i))){res.g=num(m[1]);res.unit=m[2].toLowerCase()==='ml'?'ml':'g';res.rest=m[3].trim();}
  else if((m=q.match(/^(.*?)\s+(\d+(?:[.,]\d+)?)\s*(g|gr|gram|ml)$/i))){res.g=num(m[2]);res.unit=m[3].toLowerCase()==='ml'?'ml':'g';res.rest=m[1].trim();}
  else if((m=q.match(/^(\d+(?:[.,]\d+)?)\s*(x|st|stuks?|sneetjes?|snee|boterhammen?|plakjes?|plakken|plak|glazen|glas|kopjes?|porties?|portie)?\s+(.+)$/i))){res.count=num(m[1]);res.unit=UNITMAP[(m[2]||'x').toLowerCase()]||'stuk';res.rest=m[3].trim();}
  return res;
}
/* bepaal hoeveelheid voor een product: ingevuld gewicht, getypt gewicht, aantal x portie, of standaard */
function amountFor(it,pq,gField){
  if(gField!=null)return {g:gField,text:gField+' '+it.basis};
  if(pq.g!=null)return {g:pq.g,text:pq.g+' '+it.basis};
  var por=findPortion(it,pq.count!=null?pq.unit:null);
  if(pq.count!=null&&por)return {g:Math.round(pq.count*por.g*10)/10,text:pq.count+' × '+por.unit+' ≈ '+Math.round(pq.count*por.g)+' '+it.basis+' (schatting)'};
  if(por)return {g:por.g,text:'1 '+por.unit+' ≈ '+por.g+' '+it.basis+' (schatting)'};
  return {g:100,text:'100 '+it.basis};
}
function pastMatches(q){
  var t=nvNorm(q);if(t.length<2)return [];
  return freqList(itemNames).filter(function(n){return nvNorm(n).indexOf(t)===0;}).slice(0,3);
}
function updateSugg(form){
  var box=form.nextElementSibling;if(!box||!box.classList.contains('sugg'))return;
  var raw=form.querySelector('input[name=name]').value.trim();
  var pq=parseQty(raw),q=pq.rest;
  if(nvNorm(q).length<2){box.innerHTML='';return;}
  var gF=num(form.querySelector('input[name=g]').value),km=lastKcalMap(),h='';
  pastMatches(q).forEach(function(n){h+='<button type="button" class="sg past" data-act="pick" data-past="'+esc(n)+'"><b>'+esc(n)+'</b><span class="muted small">eerder gebruikt'+(km[n]!=null?' · '+km[n]+' kcal':'')+'</span></button>';});
  nevSearch(q,6).forEach(function(it){
    var am=amountFor(it,pq,gF),k=Math.round(it.kcal*am.g/100);
    h+='<button type="button" class="sg" data-act="pick" data-code="'+it.code+'"><b>'+esc(dispName(it,q))+'</b><span class="muted small">'+it.kcal+' kcal · '+it.kj+' kJ per 100 '+it.basis+' → '+k+' kcal ('+esc(am.text)+')</span></button>';
  });
  box.innerHTML=h||'<div class="muted small" style="padding:4px 2px">Geen product gevonden in NEVO. Je kunt zelf kcal invullen.</div>';
}
function pickSuggestion(btn){
  var box=btn.closest('.sugg'),form=box&&box.previousElementSibling;if(!form)return;
  var nameI=form.querySelector('input[name=name]'),gI=form.querySelector('input[name=g]'),kI=form.querySelector('input[name=kcal]');
  if(btn.dataset.past){
    nameI.value=btn.dataset.past;delete form.dataset.nevo;delete form.dataset.nevoName;
    var km=lastKcalMap(),k0=km[norm(btn.dataset.past)];if(k0!=null&&!kI.value)kI.value=k0;
    box.innerHTML='';return;
  }
  var it=nevByCode(Number(btn.dataset.code));if(!it)return;
  var pq=parseQty(nameI.value.trim()),am=amountFor(it,pq,num(gI.value));
  var dn=dispName(it,pq.rest);nameI.value=dn;gI.value=am.g;gI.placeholder=it.basis==='ml'?'ml':'gram';
  kI.value=Math.round(it.kcal*am.g/100);
  form.dataset.nevo=it.code;form.dataset.nevoName=dn;form.dataset.nevoUnit=it.basis;
  box.innerHTML='<div class="muted small" style="padding:4px 2px">'+esc(am.text)+'. Pas het gewicht aan als je meer of minder at.</div>';
}
function mealInput(t){
  var form=t.form;
  if(t.name==='name'){
    if(form.dataset.nevo&&t.value.trim()!==form.dataset.nevoName){delete form.dataset.nevo;delete form.dataset.nevoName;delete form.dataset.nevoUnit;}
    updateSugg(form);
  }else if(t.name==='g'&&form.dataset.nevo){
    var it=nevByCode(Number(form.dataset.nevo)),g=num(t.value);
    if(it&&g!=null)form.querySelector('input[name=kcal]').value=Math.round(it.kcal*g/100);
  }
}

function tagBlock(path,label,d,listId){

/* ----- charts ----- */
function chart(spec){
  var W=640,H=220,L=34,R=8,T=10,B=24,n=spec.dates.length;
  if(!n)return '<p class="muted">Nog geen gegevens.</p>';
  var ymin=spec.ymin==null?0:spec.ymin,ymax=spec.ymax;
  var xs=function(i){return L+(W-L-R)*(n===1?0.5:i/(n-1));};
  var ys=function(v){return T+(H-T-B)*(1-(v-ymin)/((ymax-ymin)||1));};
  var bw=(W-L-R)/Math.max(n,1);
  var o='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="'+esc(spec.label||'grafiek')+'">';
  (spec.shade||[]).forEach(function(s){o+='<rect x="'+(xs(s.from)-bw/2).toFixed(1)+'" y="'+T+'" width="'+(bw*(s.to-s.from+1)).toFixed(1)+'" height="'+(H-T-B)+'" fill="'+s.color+'" opacity=".35"/>';});
  var tk=spec.ticks||4;for(var k=0;k<=tk;k++){var v=ymin+(ymax-ymin)*k/tk,y=ys(v);o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="grid"/><text x="'+(L-4)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" class="axis">'+r1(v)+'</text>';}
  var step=Math.max(1,Math.ceil(n/6));
  for(var i=0;i<n;i+=step){var dd=parse(spec.dates[i]);o+='<text x="'+xs(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" class="axis">'+dd.getDate()+'/'+(dd.getMonth()+1)+'</text>';}
  spec.series.forEach(function(s){
    if(s.type==='bar'){
      s.vals.forEach(function(v,i){if(v==null)return;var y=ys(v);o+='<rect x="'+(xs(i)-bw*0.35).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.7).toFixed(1)+'" height="'+Math.max(0,ys(ymin)-y).toFixed(1)+'" fill="'+s.color+'" rx="1.5"/>';});
    }else{
      var path='',pen=false;
      s.vals.forEach(function(v,i){if(v==null){pen=false;return;}path+=(pen?'L':'M')+xs(i).toFixed(1)+' '+ys(v).toFixed(1)+' ';pen=true;});
      o+='<path d="'+path+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round"/>';
      if(n<=60)s.vals.forEach(function(v,i){if(v!=null)o+='<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(v).toFixed(1)+'" r="2.5" fill="'+s.color+'"/>';});
    }
  });
  return o+'</svg>';
}
function chartDates(){
  var keys=Object.keys(S.days).sort();if(!keys.length)return [];
  var end=todayStr();if(keys[keys.length-1]>end)end=keys[keys.length-1];
  var start=keys[0];
  if(S.range>0){var c=addDays(end,-S.range+1);if(c>start)start=c;}
  var out=[];for(var d=start;d<=end;d=addDays(d,1))out.push(d);return out;
}
function shadeFor(dates,model){
  var res=[],cur=null;
  dates.forEach(function(dt,i){
    var ci=cycleInfo(dt,model),p=ci&&ci.phase;
    var col=p==='Menstruatie'?'var(--shade1)':(p==='Premenstrueel'?'var(--shade2)':null);
    if(col&&cur&&cur.color===col&&cur.to===i-1)cur.to=i;
    else if(col){cur={from:i,to:i,color:col};res.push(cur);}else cur=null;
  });
  return res;
}

/* ----- analysis ----- */
function verdict(a,b){
  if(a.length<3||b.length<3)return null;
  var ma=mean(a),mb=mean(b),se=Math.sqrt(variance(a)/a.length+variance(b)/b.length)||0.15,diff=ma-mb,t=diff/se,ad=Math.abs(diff),at=Math.abs(t),sig='geen';
  if(ad>=0.5&&at>=2)sig='duidelijk';else if(ad>=0.3&&at>=1.2)sig='mogelijk';
  return {n1:a.length,n0:b.length,m1:ma,m0:mb,diff:diff,t:t,sig:sig};
}
function buildRecords(model){
  var cutoff=S.range>0?addDays(todayStr(),-S.range+1):'0000-00-00';
  return Object.keys(S.days).sort().filter(function(k){return k>=cutoff;}).map(function(k){
    var d=S.days[k],items=new Set(itemNames(d)),cats=new Set(),ci=cycleInfo(k,model);
    items.forEach(function(n){CAT_RULES.forEach(function(c){if(c[1](n))cats.add(c[0]);});});
    var anyMed=S.settings.meds.some(function(m){return d.meds[m.id];});
    var leftover=false;MEALS.forEach(function(m){(d.meals[m[0]]||[]).forEach(function(i){if(i.fresh==='restje')leftover=true;});});
    return {date:k,day:d,items:items,cats:cats,ci:ci,phase:ci&&ci.phase,
      around:!!(ci&&(ci.phase==='Premenstrueel'||ci.phase==='Menstruatie')),
      coffee:d.drinks.koffie||0,alcohol:d.drinks.alcohol||0,thee:d.drinks.thee||0,
      valid:items.size>=2||d.drinks.koffie>0||d.drinks.thee>0||d.drinks.water>0||d.drinks.alcohol>0,
      logged:items.size>=2,sleep:d.body.sleep,sleepQ:d.body.sleepQ,stress:d.body.stress,work:d.act.work,
      moved:!!(d.act.bikeWork||d.act.train||d.act.walk||d.act.dog>0||d.act.minutes>0),meds:d.meds,anyMed:anyMed,
      leftover:leftover,cigs:d.smoke.cigs||0,intensity:d.act.intensity,sweat:!!d.act.sweat};
  });
}
function sigCell(v){return '<span class="sig-'+v.sig+'">'+(v.sig==='geen'?'geen verband':v.sig)+'</span>';}
function tbl(head,rows,rightFrom){
  return '<div class="scroll"><table><thead><tr>'+head.map(function(x,i){return '<th'+(rightFrom!=null&&i>=rightFrom?' class="r"':'')+'>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+
   rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(rightFrom!=null&&i>=rightFrom?' class="r"':'')+'>'+c+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';
}
function cmpRow(name,v){return [esc(name),r1(v.m1)+' (n='+v.n1+')',r1(v.m0)+' (n='+v.n0+')',(v.diff>0?'+':'')+r1(v.diff),sigCell(v)];}

function viewAnalyse(){
  var model=cycleModel(),recs=buildRecords(model);
  var outFn=function(r){return outcomeOf(S.days[addDays(r.date,S.lag)],S.outcome);};
  var withOut=recs.filter(function(r){return outFn(r)!=null;});
  var cmp=function(list,pred){var a=[],b=[];list.forEach(function(r){(pred(r)?a:b).push(outFn(r));});return verdict(a,b);};
  var h='<div class="card noprint"><div class="inline">'+
    '<div><div class="lbl">Klacht</div><select data-sel="outcome" style="width:100%">'+Object.keys(OUTCOMES).map(function(k){return '<option value="'+k+'"'+(S.outcome===k?' selected':'')+'>'+OUTCOMES[k]+'</option>';}).join('')+'</select></div>'+
    '<div><div class="lbl">Meten op</div><select data-sel="lag" style="width:100%"><option value="0"'+(S.lag===0?' selected':'')+'>Dezelfde dag</option><option value="1"'+(S.lag===1?' selected':'')+'>De dag erna</option></select></div>'+
    '<div><div class="lbl">Periode</div><select data-sel="range" style="width:100%">'+[[30,'30 dagen'],[60,'60 dagen'],[90,'90 dagen'],[0,'Alles']].map(function(x){return '<option value="'+x[0]+'"'+(S.range===x[0]?' selected':'')+'>'+x[1]+'</option>';}).join('')+'</select></div></div></div>';

  if(withOut.length<14)h+='<div class="banner warn">Nog weinig gegevens: '+withOut.length+' dag(en) met een score voor "'+OUTCOMES[S.outcome].toLowerCase()+'". Vanaf ongeveer 14 dagen krijg je eerste aanwijzingen, vanaf zes weken worden ze betrouwbaarder.</div>';

  /* food */
  var logged=withOut.filter(function(r){return r.logged;}),foodRows=[],daily=[];
  CAT_RULES.forEach(function(c){var v=cmp(logged,function(r){return r.cats.has(c[0]);});if(v)foodRows.push({name:c[0],v:v});});
  var count={};logged.forEach(function(r){r.items.forEach(function(i){count[i]=(count[i]||0)+1;});});
  Object.keys(count).forEach(function(i){
    if(count[i]<3)return;
    var v=cmp(logged,function(r){return r.items.has(i);});
    if(v)foodRows.push({name:i,v:v});else if(count[i]>=Math.max(3,logged.length-2))daily.push(i);
  });
  foodRows.sort(function(a,b){return b.v.diff-a.v.diff;});

  /* lifestyle */
  var valid=withOut.filter(function(r){return r.valid;}),life=[];
  var L=[['Koffie ≥3 kopjes',valid,function(r){return r.coffee>=3;}],
         ['Alcohol',valid,function(r){return r.alcohol>0;}],
         ['Thee',valid,function(r){return r.thee>0;}],
         ['Slecht geslapen (<6,5 u of kwaliteit ≤2)',withOut.filter(function(r){return r.sleep!=null||r.sleepQ!=null;}),function(r){return (r.sleep!=null&&r.sleep<6.5)||(r.sleepQ!=null&&r.sleepQ<=2);}],
         ['Hoge stress (2–3)',withOut.filter(function(r){return r.stress!=null;}),function(r){return r.stress>=2;}],
         ['Op kantoor gewerkt',withOut.filter(function(r){return r.work;}),function(r){return r.work==='kantoor';}],
         ['Bewogen (fiets/training/wandeling/hond)',valid,function(r){return r.moved;}],
         ['Matig of zwaar bewogen',withOut.filter(function(r){return r.intensity||r.moved;}),function(r){return r.intensity==='matig'||r.intensity==='zwaar';}],
         ['Warm geworden / gezweet',withOut,function(r){return r.sweat;}],
         ['Restje gegeten (ouder dan 1 dag)',withOut.filter(function(r){return r.logged;}),function(r){return r.leftover;}],
         ['Gerookt',withOut,function(r){return r.cigs>0;}],
         ['Nicotinepleister, -kauwgom of vape',withOut,function(r){return !!r.day.smoke.nicotine;}],
         ['Veel stuifmeel buiten',withOut,function(r){return !!r.day.env.pollen;}],
         ['Verwarming aan',withOut,function(r){return !!r.day.env.heating;}],
         ['Beddengoed verschoond',withOut,function(r){return !!r.day.env.bedding;}],
         ['Nieuw schoonmaak-/wasmiddel',withOut,function(r){return !!r.day.env.cleaning;}]];
  S.settings.meds.forEach(function(m){L.push([m.name+' genomen',withOut.filter(function(r){return r.anyMed;}),function(r){return !!r.meds[m.id];}]);});
  L.forEach(function(x){var v=cmp(x[1],x[2]);if(v)life.push({name:x[0],v:v});});

  /* coffee bins */
  var bins=[['0–1',function(c){return c<=1;}],['2–3',function(c){return c>=2&&c<=3;}],['4 of meer',function(c){return c>=4;}]];
  var coffeeRows=bins.map(function(b){var a=valid.filter(function(r){return b[1](r.coffee);}).map(outFn);return [b[0],a.length?r1(mean(a)):'–',a.length];}).filter(function(r){return r[2]>0;});

  /* cycle */
  var byPhase={};PHASE_ORDER.forEach(function(p){byPhase[p]=[];});
  withOut.forEach(function(r){if(r.phase)byPhase[r.phase].push(outFn(r));});
  var thr=S.outcome==='combined'?1.5:2;
  var phaseRows=PHASE_ORDER.filter(function(p){return byPhase[p].length;}).map(function(p){var a=byPhase[p];return [p,a.length,r1(mean(a)),Math.round(100*a.filter(function(x){return x>=thr;}).length/a.length)+'%'];});
  var cycV=cmp(withOut.filter(function(r){return r.phase;}),function(r){return r.around;});

  /* combos */
  var cphase=withOut.filter(function(r){return r.phase;});
  var C=[['Gerijpt / gefermenteerd / gerookt',cphase.filter(function(r){return r.logged;}),function(r){return r.cats.has('Gerijpt / gefermenteerd / gerookt');}],
         ['Histamine-vrijmaker',cphase.filter(function(r){return r.logged;}),function(r){return r.cats.has('Histamine-vrijmaker');}],
         ['Zout / bewerkt',cphase.filter(function(r){return r.logged;}),function(r){return r.cats.has('Zout / bewerkt');}],
         ['Zuivel',cphase.filter(function(r){return r.logged;}),function(r){return r.cats.has('Zuivel');}],
         ['Gluten / tarwe',cphase.filter(function(r){return r.logged;}),function(r){return r.cats.has('Gluten / tarwe');}],
         ['Restje gegeten',cphase.filter(function(r){return r.logged;}),function(r){return r.leftover;}],
         ['Alcohol',cphase.filter(function(r){return r.valid;}),function(r){return r.alcohol>0;}],
         ['Koffie ≥3',cphase.filter(function(r){return r.valid;}),function(r){return r.coffee>=3;}]];
  var combos=[];
  C.forEach(function(x){
    var cell={aY:[],aN:[],oY:[],oN:[]};
    x[1].forEach(function(r){var y=x[2](r),k=(r.around?'a':'o')+(y?'Y':'N');cell[k].push(outFn(r));});
    if(cell.aY.length+cell.oY.length<4)return;
    var dd=null;
    if(cell.aY.length>=2&&cell.aN.length>=2&&cell.oY.length>=2&&cell.oN.length>=2)dd=(mean(cell.aY)-mean(cell.aN))-(mean(cell.oY)-mean(cell.oN));
    combos.push({name:x[0],cell:cell,dd:dd});
  });
  var cellTxt=function(a){return a.length>=2?r1(mean(a))+' (n='+a.length+')':(a.length?'n='+a.length:'–');};

  /* test phases */
  var phaseTest=PHASES.map(function(p){var a=withOut.filter(function(r){return r.day.test.phase===p;}).map(outFn);return [p,a.length,a.length?r1(mean(a)):'–'];}).filter(function(r){return r[1]>0;});
  var baseList=withOut.filter(function(r){return r.day.test.phase==='Lage-histaminebasis';});
  if(!baseList.length)baseList=withOut.filter(function(r){return !(r.day.test.phase==='Terugvoeren'&&r.day.test.product);});
  var baseM=mean(baseList.map(outFn));
  var prods={};recs.forEach(function(r){var p=norm(r.day.test.product);if(r.day.test.phase==='Terugvoeren'&&p){(prods[p]=prods[p]||[]).push(r);}});
  var prodRows=Object.keys(prods).map(function(p){
    var a=prods[p].map(function(r){return outcomeOf(r.day,S.outcome);}).filter(function(x){return x!=null;});
    var b=prods[p].map(function(r){return outcomeOf(S.days[addDays(r.date,1)],S.outcome);}).filter(function(x){return x!=null;});
    return [esc(p),prods[p].length,a.length?r1(mean(a)):'–',b.length?r1(mean(b)):'–'];
  });

  /* summary */
  var ins=[];
  foodRows.concat(life).forEach(function(x){if(x.v.sig!=='geen'&&x.v.diff>0)ins.push({s:x.v.sig==='duidelijk'?2:1,t:'<b>'+esc(x.name)+'</b>: gemiddeld '+r1(x.v.m1)+' met tegenover '+r1(x.v.m0)+' zonder (n='+x.v.n1+' / '+x.v.n0+', '+x.v.sig+').'});});
  if(cycV&&cycV.sig!=='geen')ins.push({s:cycV.sig==='duidelijk'?2:1,t:'<b>Rond je menstruatie</b> (5 dagen ervoor tot en met menstruatie): gemiddeld '+r1(cycV.m1)+' tegenover '+r1(cycV.m0)+' in de rest van je cyclus ('+cycV.sig+').'});
  combos.forEach(function(c){if(c.dd!=null&&c.dd>=0.6)ins.push({s:1,t:'<b>'+esc(c.name)+'</b> geeft rond je menstruatie een groter verschil dan de rest van de maand (extra +'+r1(c.dd)+').'});});
  ins.sort(function(a,b){return b.s-a.s;});

  h+='<div class="card"><h2>Samenvatting</h2>';
  if(ins.length)h+='<ul class="tight">'+ins.slice(0,7).map(function(i){return '<li>'+i.t+'</li>';}).join('')+'</ul>';
  else h+='<p class="muted">Nog geen duidelijke aanwijzingen. Dat kan komen door te weinig dagen, of doordat er geen verband is dat uit de gegevens naar voren komt.</p>';
  h+='<p class="muted small">Dit zijn verbanden in je eigen gegevens, geen bewijs voor oorzaak en gevolg. Cetirizine en zalf dempen klachten, dus effecten kunnen kleiner uitvallen dan ze zijn. Bespreek opvallende patronen met je huisarts of diëtist.</p></div>';

  h+='<div class="card"><h2>Cyclus</h2>';
  if(!model.starts.length)h+='<p class="muted">Markeer op de dagpagina de eerste dag van je menstruatie ("Eerste dag nieuwe cyclus"). Daarna rekent de app cyclusdag en fase uit.</p>';
  else{
    h+='<p class="small muted">Gemiddelde cyclusduur: '+model.avg+' dagen'+(model.known?'':' (standaardwaarde, nog te weinig cycli)')+(model.diffs.length?'. Gemeten: '+model.diffs.join(', ')+' dagen':'')+'. In de overgangsjaren kan de cyclus onregelmatig zijn, dus de fasen zijn schattingen.</p>';
    h+=phaseRows.length?tbl(['Fase','Dagen','Gem. score','Dagen ≥'+r1(thr)],phaseRows,1):'<p class="muted">Nog geen klachtscores binnen een cyclusfase.</p>';
  }
  h+='</div>';

  var whenC={},durC={'<24u':0,'>24u':0},whenN=0,durN=0;
  recs.forEach(function(r){
    var s=r.day.sym,bad=(s.eyes>0)||(s.pressure>0)||(s.hives>0);
    if(s.when&&bad){whenC[s.when]=(whenC[s.when]||0)+1;whenN++;}
    if(s.hivesDur&&s.hives>0){durC[s.hivesDur]++;durN++;}
  });
  h+='<div class="card"><h2>Wanneer en hoe lang</h2>';
  if(whenN||durN){
    if(whenN)h+=tbl(['Moment met de meeste last','Dagen'],['ochtend','middag','avond','hele dag'].filter(function(k){return whenC[k];}).map(function(k){return [k.charAt(0).toUpperCase()+k.slice(1),whenC[k]];}),1);
    if(durN){
      h+='<div style="margin-top:10px">'+tbl(['Duur van de bultjes','Dagen'],[['Korter dan 24 uur',durC['<24u']],['Langer dan 24 uur',durC['>24u']]],1)+'</div>';
      if(durN>=3){
        var sh=durC['<24u']/durN;
        h+='<p class="small muted" style="margin-top:8px">'+(sh>=0.7?'Bultjes die binnen een dag verdwijnen passen bij netelroos, en dat sluit aan bij een histamine- of allergische reactie.':(sh<=0.3?'Bultjes die dagenlang blijven passen vaker bij eczeem of een contactreactie op een product dan bij voeding. Bespreek dat met je huisarts of huidtherapeut.':'Je hebt zowel korte als langdurige bultjes. Houd bij elke keer bij wat eraan voorafging.'))+'</p>';
      }
    }
  }else h+='<p class="muted">Vul op de dagpagina in wanneer je last hebt en hoe lang de bultjes blijven, dan verschijnt hier een overzicht.</p>';
  h+='</div>';

  h+='<div class="card"><h2>Voeding</h2>';
  if(foodRows.length){
    h+='<div class="muted small" style="margin-bottom:6px">Gemiddelde score op dagen met dit product tegenover dagen zonder. Alleen producten met minstens 3 dagen met en zonder.</div>'+
       tbl(['Product of groep','Met','Zonder','Verschil','Signaal'],foodRows.slice(0,15).map(function(x){return cmpRow(x.name,x.v);}));
  }else h+='<p class="muted">Nog te weinig dagen met eten en klachten ingevuld om te vergelijken.</p>';
  if(daily.length)h+='<p class="small muted" style="margin-top:8px">Je eet bijna elke dag: <b>'+daily.slice(0,8).map(esc).join(', ')+'</b>. Daar valt niets mee te vergelijken. Dat kan alleen door ze tijdelijk weg te laten.</p>';
  h+='</div>';

  h+='<div class="card"><h2>Drinken, omgeving en leefstijl</h2>';
  h+=life.length?tbl(['Factor','Met','Zonder','Verschil','Signaal'],life.map(function(x){return cmpRow(x.name,x.v);})):'<p class="muted">Nog te weinig gegevens.</p>';
  if(coffeeRows.length)h+='<div style="margin-top:10px"><div class="lbl">Koffie per dag en gemiddelde score</div>'+tbl(['Kopjes','Gem. score','Dagen'],coffeeRows,1)+'</div>';
  h+='</div>';

  h+='<div class="card"><h2>Combinaties met je cyclus</h2>';
  if(combos.length){
    h+='<div class="muted small" style="margin-bottom:6px">Gemiddelde score, uitgesplitst naar "rond menstruatie" (5 dagen ervoor tot en met menstruatie) en de rest van je cyclus.</div>'+
       tbl(['Factor','Rond menst. met','Rond menst. zonder','Overig met','Overig zonder','Extra effect'],combos.map(function(c){return [esc(c.name),cellTxt(c.cell.aY),cellTxt(c.cell.aN),cellTxt(c.cell.oY),cellTxt(c.cell.oN),c.dd==null?'–':((c.dd>0?'+':'')+r1(c.dd))];}));
    h+='<div class="muted small" style="margin-top:6px">"Extra effect" laat zien hoeveel groter het verschil met/zonder rond je menstruatie is dan in de rest van de maand. Vanaf ongeveer +0,6 is het de moeite waard om dit te testen.</div>';
  }else h+='<p class="muted">Nog te weinig dagen per cel. Dit werkt pas als je minstens één menstruatie hebt gemarkeerd en daarna een paar weken eten en klachten bijhoudt.</p>';
  h+='</div>';

  h+='<div class="card"><h2>Testfase</h2>';

  if(prodRows.length)h+='<div style="margin-top:10px"><div class="lbl">Testproducten in de terugvoerfase (basis: gem. '+r1(baseM)+')</div>'+tbl(['Product','Dagen','Zelfde dag','Dag erna'],prodRows,1)+'</div>';
  if(!phaseTest.length)h+='<p class="muted">Zet op de dagpagina je testfase en testproduct, dan verschijnt hier de vergelijking.</p>';
  h+='</div>';
  h+='<div class="noprint" style="text-align:center"><button class="btn ghost" data-act="print">Print / opslaan als PDF</button></div>';
  return h;
}

    meds.forEach(function(m){row.push(d.meds[m.id]?1:0);});
    row=row.concat([d.sym.when,d.sym.hivesDur,d.env.pollen?1:0,d.env.heating?1:0,d.env.bedding?1:0,d.env.cleaning?1:0,d.smoke.cigs||0,d.smoke.nicotine?1:0,d.act.intensity,d.act.sweat?1:0,d.cyc.mens?1:0,d.cyc.first?1:0,ci?ci.day:'',ci&&ci.phase?ci.phase:'',d.cyc.kramp,d.cyc.vocht,d.cyc.hoofd,d.cyc.stemming,d.cyc.vlam,
      d.body.weight==null?'':String(d.body.weight).replace('.',','),d.body.sleep==null?'':String(d.body.sleep).replace('.',','),d.body.sleepQ,d.body.stress,d.act.work,d.act.bikeWork?1:0,d.act.dog||0,d.act.train?1:0,d.act.walk?1:0,d.act.minutes,
      d.house.tasks.join('; '),d.house.shop?1:0,d.people.work.join('; '),d.people.home.join('; '),d.test.phase,d.test.product,d.notes]);
    return row.map(csvCell).join(';');
  });
  download('gezondheidsdagboek-'+todayStr()+'.csv','\ufeff'+[head.map(csvCell).join(';')].concat(rows).join('\r\n'),'text/csv;charset=utf-8');
}

/* ================= events ================= */
function gotoDate(s){S.date=s;S.weekStart=mondayOf(s);render();}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(a==='tab'){S.tab=t.dataset.tab;S.msg='';render();window.scrollTo(0,0);}
  else if(a==='prevday')gotoDate(addDays(S.date,-1));
  else if(a==='nextday')gotoDate(addDays(S.date,1));
  else if(a==='today')gotoDate(todayStr());
  else if(a==='gotoday'){S.tab='dag';gotoDate(t.dataset.date);window.scrollTo(0,0);}
  else if(a==='weekprev'){S.weekStart=addDays(S.weekStart||mondayOf(S.date),-7);render();}
  else if(a==='weeknext'){S.weekStart=addDays(S.weekStart||mondayOf(S.date),7);render();}
  else if(a==='scale'){var v=Number(t.dataset.val),p=t.dataset.path;edit(function(d){setPath(d,p,getPath(d,p)===v?null:v);});render();}
  else if(a==='count'){var p2=t.dataset.path,dl=Number(t.dataset.delta);edit(function(d){setPath(d,p2,Math.max(0,(getPath(d,p2)||0)+dl));});render();}
  else if(a==='toggle'){var p3=t.dataset.path;edit(function(d){var nv=!getPath(d,p3);setPath(d,p3,nv);if(p3==='cyc.first'&&nv)d.cyc.mens=true;});render();}
  else if(a==='choose'){var p4=t.dataset.path,vv=t.dataset.val;edit(function(d){setPath(d,p4,getPath(d,p4)===vv?'':vv);});render();}
  else if(a==='task'){var tv=t.dataset.val;edit(function(d){var i=d.house.tasks.indexOf(tv);if(i>=0)d.house.tasks.splice(i,1);else d.house.tasks.push(tv);});render();}
  else if(a==='delitem'){var ml=t.dataset.meal,ix=Number(t.dataset.idx);edit(function(d){d.meals[ml].splice(ix,1);});render();}
  else if(a==='deltag'){var p5=t.dataset.path,ix2=Number(t.dataset.idx);edit(function(d){getPath(d,p5).splice(ix2,1);});render();}
  else if(a==='delmed'){var id=t.dataset.id;if(S.settings.meds.length>1||true){editSettings(function(s){s.meds=s.meds.filter(function(m){return m.id!==id;});});render();}}
  else if(a==='pick')pickSuggestion(t);
  else if(a==='print')window.print();
  else if(a==='csv')exportCSV();
  else if(a==='json')download('gezondheidsdagboek-backup-'+todayStr()+'.json',JSON.stringify({days:S.days,settings:S.settings},null,1),'application/json');
  else if(a==='importbtn'){var f=document.getElementById('importfile');if(f)f.click();}
  else if(a==='copyrules'){var pre=document.getElementById('rules');if(navigator.clipboard&&pre){navigator.clipboard.writeText(pre.textContent).then(function(){S.msg='Regels gekopieerd.';S.msgType='ok';render();});}}
  else if(a==='savefb'){
    var ta=document.querySelector('[data-fbcfg]');var cfg=parseFbConfig(ta?ta.value:'');
    if(!cfg){S.msg='Configuratie niet herkend. Plak het volledige firebaseConfig-blok (met apiKey en projectId).';S.msgType='err';render();return;}
    lsSet(LS_FB,JSON.stringify(cfg));S.msg='Configuratie opgeslagen. Log hieronder in.';S.msgType='ok';
    if(typeof firebase!=='undefined'&&!auth)initFirebase();else if(typeof firebase==='undefined'){S.msg='Opgeslagen, maar de Firebase-bibliotheek kon niet laden (offline?).';S.msgType='err';}
    render();
  }
  else if(a==='login'||a==='signup'){
    if(!auth){S.msg='Firebase is nog niet verbonden. Sla eerst de configuratie op en laad de pagina opnieuw.';S.msgType='err';render();return;}
    var em=document.getElementById('fb-email').value.trim(),pw=document.getElementById('fb-pass').value;
    if(!em||!pw){S.msg='Vul e-mail en wachtwoord in.';S.msgType='err';render();return;}
    var pr=a==='login'?auth.signInWithEmailAndPassword(em,pw):auth.createUserWithEmailAndPassword(em,pw);
    pr.then(function(){S.msg='';render();}).catch(function(er){S.msg='Inloggen mislukt: '+er.message;S.msgType='err';render();});
  }
  else if(a==='logout'&&auth){auth.signOut().then(function(){S.msg='Uitgelogd.';S.msgType='ok';render();});}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  var kind=f.dataset.form,fd=new FormData(f);
  if(kind==='meal'){
    var raw=String(fd.get('name')||'').trim();if(!raw)return;
    var pq=parseQty(raw),name=pq.rest||raw;
    var rawK=String(fd.get('kcal')||''),kcal=num(rawK.replace(/kj/i,'')),kjIn=null;
    if(/kj/i.test(rawK)&&kcal!=null){kjIn=Math.round(kcal);kcal=kcal/4.184;}
    var gIn=num(fd.get('g'));if(gIn==null&&pq.g!=null)gIn=pq.g;
    var code=f.dataset.nevo?Number(f.dataset.nevo):null,uIn=f.dataset.nevoUnit||pq.unit||'g';
    if(code!=null&&f.dataset.nevoName!==name)code=null;
    if(code!=null&&gIn!=null){var it0=nevByCode(code);if(it0){var ck=Math.round(it0.kcal*gIn/100);if(kcal==null||Math.round(kcal)===ck){kcal=it0.kcal*gIn/100;kjIn=Math.round(it0.kj*gIn/100);}}}
    var tm=String(fd.get('t')||''),ml=f.dataset.meal;
    edit(function(d){d.meals[ml].push({t:tm,name:name,kcal:kcal==null?null:Math.round(kcal),kj:kjIn,g:gIn,u:gIn!=null?(uIn==='ml'?'ml':'g'):null,nevo:code,fresh:String(fd.get('fresh')||'vers')});d.meals[ml].sort(function(a,b){return (a.t||'').localeCompare(b.t||'');});});
    S.focus='form[data-meal="'+ml+'"] input[name=name]';render();
  }else if(kind==='tag'){
    var tg=String(fd.get('tag')||'').trim();if(!tg)return;var p=f.dataset.path;
    edit(function(d){var arr=getPath(d,p);if(arr.map(norm).indexOf(norm(tg))<0)arr.push(tg);});
    S.focus='form[data-path="'+p+'"] input[name=tag]';render();
  }else if(kind==='med'){
    var mn=String(fd.get('name')||'').trim();if(!mn)return;
    editSettings(function(s){s.meds.push({id:'m'+Date.now().toString(36),name:mn});});render();
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset.in){var p=t.dataset.in,v=t.value;if(t.dataset.type==='num')v=num(v);edit(function(d){setPath(d,p,v);});}
  else if(t.dataset.med){var id=t.dataset.med,nm=t.value;editSettings(function(s){s.meds.forEach(function(m){if(m.id===id)m.name=nm;});});}
  else if(t.form&&t.form.dataset&&t.form.dataset.form==='meal'){mealInput(t);}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.pick==='date'&&t.value){gotoDate(t.value);}
  else if(t.dataset.sel){
    var k=t.dataset.sel;
    if(k==='range')S.range=Number(t.value);else if(k==='lag')S.lag=Number(t.value);else if(k==='outcome')S.outcome=t.value;else if(k==='metric')S.metric=t.value;
    render();
  }
  else if(t.dataset.in==='test.phase'){render();}
  else if(t.name==='name'&&t.form&&t.form.dataset.form==='meal'){
    var k2=norm(t.value),km=lastKcalMap();var kc=t.form.querySelector('input[name=kcal]');
    if(kc&&!kc.value&&km[k2]!=null)kc.value=km[k2];
  }
  else if(t.id==='importfile'&&t.files&&t.files[0]){
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var o=JSON.parse(rd.result),n=0;
        Object.keys(o.days||{}).forEach(function(k){var nd=normDay(o.days[k],k),l=S.days[k];if(!l||(nd.updatedAt||0)>=(l.updatedAt||0)){S.days[k]=nd;pushDay(k);n++;}});
        if(o.settings&&Array.isArray(o.settings.meds)&&(o.settings.updatedAt||0)>(S.settings.updatedAt||0)){S.settings=Object.assign({},S.settings,o.settings);persistSettings();pushSettings();}
        persistDays();S.msg=n+' dagen teruggezet.';S.msgType='ok';render();
      }catch(er){S.msg='Back-up lezen mislukt: '+er.message;S.msgType='err';render();}
    };
    rd.readAsText(t.files[0]);
  }
});

/* ================= start ================= */
load();
S.weekStart=mondayOf(S.date);
render();
initFirebase();
window.__gt={S:S,render:render,cycleModel:cycleModel,cycleInfo:cycleInfo};
})();
</script>
